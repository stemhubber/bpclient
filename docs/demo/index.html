<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f7" />
    <meta name="description" content="BitePilot restaurant operations demo for Sweet n Lovely." />
    <title>BitePilot — Kitchen & business demo</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="storefront.css" />
    <link rel="stylesheet" href="pricing.css" />
    <script src="menu-data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="demo-ribbon"><span class="demo-dot"></span> Demo environment · Example orders · Changes reset on reload</div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="index.html" aria-label="BitePilot workspace home">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none"><path d="M8 14.5c0-2.2 1.8-4 4-4h24a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4v-19Z" fill="#fff"/><path d="M14 16v8.4c0 5.5 4.5 10 10 10s10-4.5 10-10V16M18 16v7m6-7v6m6-6v7" stroke="#20231F" stroke-width="2.6" stroke-linecap="round"/><path d="M24 34.5v3.2m-7.5 0h15" stroke="#F47721" stroke-width="2.6" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-name"><span>Bite</span>Pilot<small>YOUR KITCHEN, IN GOOD HANDS</small></span>
        </a>
        <div class="business-switcher">
          <span class="business-avatar">S</span>
          <span class="business-name">Sweet n Lovely<small>Khayelitsha · Main kitchen</small></span>
          <span class="switch-chevron" aria-hidden="true">⌄</span>
        </div>
        <p class="nav-caption">WORKSPACE</p>
        <nav class="nav-list" id="main-nav">
          <button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span> Overview</button>
          <button class="nav-item" data-view="kitchen"><span class="nav-icon">▤</span> Kitchen <span class="nav-count" id="nav-new-count">2</span></button>
          <button class="nav-item" data-view="orders"><span class="nav-icon">▧</span> Orders</button>
          <button class="nav-item" data-view="menu"><span class="nav-icon">☷</span> Menu</button>
          <button class="nav-item" data-view="pricing"><span class="nav-icon">R</span> Pricing</button>
          <button class="nav-item" data-view="settings">Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="open-card" id="sidebar-open-toggle" type="button" role="switch" aria-checked="true"><span class="open-indicator"></span><span><b>Taking orders</b><small>Customers can order now</small></span><span class="toggle-on" aria-hidden="true"><i></i></span></button>
          <div class="profile-row"><span class="profile-avatar">AJ</span><span class="profile-name">Amahle Jenete<small>Business owner</small></span><button class="more-button" aria-label="Profile options">···</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-bite">Bite</span>Pilot</div>
          <div class="breadcrumbs"><span>Sweet n Lovely</span><b>/</b><strong id="breadcrumb-current">Overview</strong></div>
          <div class="top-actions">
            <button class="service-pill service-toggle" id="service-toggle" type="button" role="switch" aria-checked="true"><i></i><span>Taking orders</span></button>
            <button class="new-orders-shortcut" type="button" data-go="kitchen"><span class="new-orders-count" id="top-new-count">1</span> New order</button>
            <a class="storefront-button" id="storefront-button" href="storefront.html" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> Preview storefront</a>
          </div>
        </header>

        <div class="page-content" id="page-content" tabindex="-1"></div>
        <footer class="page-footer"><span>BitePilot</span><span>Made for the people behind the food.</span><span>Demo view · <span id="today-date"></span></span></footer>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
  </body>
</html>
